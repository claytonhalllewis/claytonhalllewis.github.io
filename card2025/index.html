<!DOCTYPE html>
<html>
<head>
    <title>2026 Paintbrush Reveal</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            font-family: 'Arial Black', sans-serif;
        }

        #toolbar {
            height: 50px;
            background: #111;
            color: #ff4444;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            position: relative;
            border-bottom: 1px solid #444;
        }

        #canvasContainer {
            position: relative;
            width: 100vw;
            height: calc(100vh - 50px);
            /* The "Paper" underneath */
            background-color: #e0f0ff; 
            cursor: crosshair;
            overflow: hidden;
        }

        #backgroundText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-size: 8vw;
            text-align: center;
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: transparent;
        }

        /* The Tilted Paintbrush */
        #brush {
            position: absolute;
            width: 24px;
            height: 100px;
            pointer-events: none;
            z-index: 100;
            opacity: 0; 
            transform: rotate(25deg);
            /* Anchor at the bottom center of the bristles */
            transform-origin: bottom center;
        }
        
        /* Brush Handle */
        .handle {
            width: 8px;
            height: 60px;
            background: #5d4037; /* Dark wood */
            margin: 0 auto;
            border-radius: 4px 4px 0 0;
        }

        /* Metal Ferrule */
        .ferrule {
            width: 18px;
            height: 15px;
            background: linear-gradient(to right, #999, #eee, #999);
            margin: 0 auto;
            border: 1px solid #777;
        }

        /* Bristles */
        .bristles {
            width: 22px;
            height: 25px;
            background: #d2b48c; /* Tan bristles */
            margin: 0 auto;
            border-radius: 0 0 8px 8px;
            border: 1px solid #bda07a;
            /* Give it a bristle texture */
            background-image: repeating-linear-gradient(to right, transparent, transparent 2px, rgba(0,0,0,0.1) 3px);
        }
        
        button {
            padding: 5px 15px;
            margin-left: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <span>(Click anywhere to Start | Press Esc to Exit) Rub off the silver to reveal a message.</span>
        <button id="resetBtn">Reset Silver Foil</button>
    </div>

    <div id="canvasContainer">
        <div id="backgroundText">Happy New Year 2026</div>
        <canvas id="revealCanvas"></canvas>
        
        <div id="brush">
            <div class="handle"></div>
            <div class="ferrule"></div>
            <div class="bristles"></div>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('revealCanvas');
        var ctx = canvas.getContext('2d');
        var brush = document.getElementById('brush');
        var container = document.getElementById('canvasContainer');
        var resetBtn = document.getElementById('resetBtn');
        
        var penX = 0;
        var penY = 0;
        var isDrawing = false;
        var hasStarted = false;

        function setup() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            fillSilver();

            // Set drawing mode to "Erase"
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 60; // Slightly wider for a brush
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function fillSilver() {
            var oldOp = ctx.globalCompositeOperation;
            ctx.globalCompositeOperation = 'source-over';
            
            // Fill Silver
            ctx.fillStyle = "#b0b0b0"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add texture
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            for (var i = 0; i < 1500; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }
            
            ctx.globalCompositeOperation = oldOp;
        }

        function updateBrushVisual() {
            // Adjust so the bottom center of the bristles is at penX, penY
            // Total height of brush parts is 100px
            brush.style.left = (penX - 12) + "px";
            brush.style.top = (penY - 100) + "px";
        }

        container.addEventListener('mousedown', function(e) {
            if (canvas.requestPointerLock) {
                canvas.requestPointerLock();
            }

            var rect = canvas.getBoundingClientRect();
            
            if (!hasStarted) {
                penX = e.clientX - rect.left;
                penY = e.clientY - rect.top;
                brush.style.opacity = "1";
                hasStarted = true;
            }

            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(penX, penY);
            updateBrushVisual();
        });

        window.addEventListener('mousemove', function(e) {
            if (!hasStarted) return;

            if (document.pointerLockElement === canvas) {
                var dx = e.movementX;
                var dy = e.movementY;

                // Inverted Logic: Right=Up, Left=Down, Up=Left, Down=Right
                penX = penX + dy; 
                penY = penY - dx;

                if (penX < 0) penX = 0;
                if (penX > canvas.width) penX = canvas.width;
                if (penY < 0) penY = 0;
                if (penY > canvas.height) penY = canvas.height;

                updateBrushVisual();

                if (isDrawing) {
                    ctx.lineTo(penX, penY);
                    ctx.stroke();
                }
            }
        });

        window.addEventListener('mouseup', function() {
            isDrawing = false;
        });

        document.addEventListener('pointerlockchange', function() {
            if (document.pointerLockElement !== canvas) {
                brush.style.opacity = "0";
                isDrawing = false;
                hasStarted = false; 
            }
        });

        resetBtn.addEventListener('click', function() {
            fillSilver();
        });

        window.onload = setup;
        window.onresize = setup;

    </script>
</body>
</html>
