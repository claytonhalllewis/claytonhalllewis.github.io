<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pattern Engine - Letter Tests</title>
    <style>
        body { font-family: 'Consolas', monospace; margin: 20px; background: #fff; }
        .container { max-width: 1200px; margin: auto; border: 2px solid #000; padding: 20px; }
        .input-section { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #000; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 10px; font-size: 1.2rem; border: 1px solid #000; }
        button { padding: 10px 30px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-right: 10px; }
        button:hover { background: #333; }
        
        /* New Toggle Style */
        .toggle-container { display: flex; align-items: center; gap: 5px; font-weight: bold; margin-right: 10px; background: #eee; padding: 10px; border: 1px solid #000; }
        input[type="checkbox"] { transform: scale(1.5); margin: 0 5px; cursor: pointer; }

        .rel-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .rel-box { border: 1px solid #000; padding: 10px; height: 100px; overflow-y: auto; }
        h2 { font-size: 1rem; margin: 0 0 10px 0; background: #eee; padding: 5px; border-bottom: 1px solid #000; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; vertical-align: top; font-size: 0.85rem; }
        th { background: #eee; }
        .winner-row { background: #000; color: #fff; }
        
        /* Styles for test results */
        #testResults { margin-top: 20px; border-top: 4px solid #000; padding-top: 20px; }
        .fail-item { background: #fee; border: 1px solid red; padding: 10px; margin-bottom: 10px; font-family: 'Consolas', monospace; word-break: break-all; }
        .fail-label { font-weight: bold; display: inline-block; width: 120px; }
        .summary { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .success { color: green; }
        .failure { color: red; }
    </style>
</head>
<body>
VC  combined
<div class="container">
    <div class="input-section">
        <input type="text" id="inputStr" value="[s]{s}[x]{x}[ab]{ab}[cde]{cde}[">
        
        <div class="toggle-container">
            <input type="checkbox" id="useFixedRels">
            <label for="useFixedRels">Use Fixed Relations</label>
        </div>

        <button onclick="executeStepManual()">Execute Step</button>
        <button onclick="runTests()" style="background: #000080;">Run 100 letter Tests</button>
    </div>

    <div class="rel-grid">
        <div class="rel-box"><h2>CP Relations</h2><div id="cpDisp"></div></div>
        <div class="rel-box"><h2>CF Relations</h2><div id="cfDisp"></div></div>
        <div class="rel-box"><h2>AL Relations</h2><div id="alDisp"></div></div>
    </div>

    <h2>Active Rules (Manual Mode)</h2>
    <table id="ruleTable">
        <thead>
            <tr><th>Type</th><th>Context</th><th>Condition</th><th>Prediction</th><th>Score</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Score Summation (Manual Mode)</h2>
    <table id="sumTable">
        <thead>
            <tr><th>Char</th><th>Breakdown</th><th>Total</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="testResults"></div>
</div>

<script>
// Logic Helper Functions
function getUniqueChars(s) {
    var u = [];
    for (var i = 0; i < s.length; i++) {
        if (u.indexOf(s[i]) === -1) u.push(s[i]);
    }
    return u;
}

function getIdx(s, c) {
    var a = [];
    for (var i = 0; i < s.length; i++) {
        if (s[i] === c) a.push(i);
    }
    return a;
}

function getPre(s, c) {
    var idxs = getIdx(s, c);
    var p = [];
    for (var i = 0; i < idxs.length; i++) {
        if (idxs[i] > 0) p.push(s[idxs[i] - 1]);
    }
    return p;
}
function getUPre(s,c)
{
    return getUniqueChars(getPre(s,c));
}
function getFol(s, c) {
    var idxs = getIdx(s, c);
    var f = [];
    for (var i = 0; i < idxs.length; i++) {
        if (idxs[i] < s.length - 1) f.push(s[idxs[i] + 1]);
    }
    return f;
}
function getUFol(s,c)
{
    return getUniqueChars(getFol(s,c));
}

function isSubset(a, b) {
    if (a.length === 0) return false;
    for (var i = 0; i < a.length; i++) {
        if (b.indexOf(a[i]) === -1) return false;
    }
    return true;
}
function countRecentFollowerMatches(str, char1, char2) {
  let count = 0;
  let lastFollower = null;

  for (let i = 0; i < str.length; i++) {
    if (str[i] === char2) {
      if (i + 1 < str.length) {
        lastFollower = str[i + 1];
      }
    } 
    else if (str[i] === char1) {
      if (lastFollower !== null && i + 1 < str.length) {
        if (str[i + 1] === lastFollower) {
          count++;
        }
      }
    }
  }

  return count;
}
//tests
const example1 = "[[s]{s}[x]{x}[ab]{ab}[cde]{cde}[b]{";
console.log("CP",countRecentFollowerMatches(example1, '{', '['));
function countPrecededMatches(str, char1, char2) {
  let count = 0;
  let lastPredecessor = null;

  for (let i = 1; i < str.length; i++) {
    if (str[i] === char2) {
      lastPredecessor = str[i - 1];
    } 
    else if (str[i] === char1) {
      if (lastPredecessor !== null && str[i - 1] === lastPredecessor) {
        count++;
      }
    }
  }

  return count;
}

const testStr = "[abc]{abd}[def]{def}[gh]{";
console.log("CF",countPrecededMatches(testStr, '{', '['));


function isAlt(i1, i2) {
    if (i1.length < 2 || i2.length < 2) return false;
    var combined = [];
    for (var i = 0; i < i1.length; i++) combined.push({v: i1[i], t: 1});
    for (var i = 0; i < i2.length; i++) combined.push({v: i2[i], t: 2});
    combined.sort(function(a, b) { return a.v - b.v; });
    for (var i = 0; i < combined.length - 1; i++) {
        if (combined[i].t === combined[i+1].t) return false;
    }
    return true;
}

// ---------------------------------------------------------
// CORE LOGIC (Decoupled from UI)
// ---------------------------------------------------------
function predictNext(input) {
    var chars = getUniqueChars(input);
    var rules = [];
    var rels = { cp: [], cf: [], al: [] };
    var totalPos = {}; //positive votes
    var totalNeg={}; //negative votes
    var breakdown = {};

    // CHECK TOGGLE STATE
    var useFixed = document.getElementById('useFixedRels').checked;

    if (!useFixed) {
        // PASS 1: ESTABLISH GLOBAL RELATIONSHIPS (AUTO DISCOVERY)
        for (var i = 0; i < chars.length; i++) {
            for (var j = 0; j < chars.length; j++) {
                var a = chars[i];
                var b = chars[j];
                if (a === b) continue;

                var iA = getIdx(input, a);
                var iB = getIdx(input, b);

                // Frequency Requirement: Both must occur at least n times
                if (iA.length >= 4 && iB.length >= 4) {
                    // Check AL
                    if (a < b && isAlt(iA, iB)) {
                        rels.al.push([a, b]);
                    }
                    // Check CF
                    if((getFol(input,a).length>=4)&&countPrecededMatches(input,a,b)==getFol(input,a).length)
                        rels.cf.push([a,b]);
                    
                    // Check CP
                    if((getFol(input,a).length>=4)&&countRecentFollowerMatches(input,a,b)==getFol(input,a).length)
                        rels.cp.push([a,b]);
                }
            }
        }
    } else {
        // FIXED RELATIONS (MANUAL OVERRIDE)
        rels.al.push(['[', '{']);
        rels.al.push([']', '}']);
        rels.al.push(['[', ']']);
        rels.al.push(['{', '}']);
        rels.cf.push(['}', ']']);
        rels.cp.push(['{', '[']);
    }

    // Pass 2: Define Rule Applicator
    function addRule(r) {
        rules.push(r);
        if (!totalPos[r.pred]) totalPos[r.pred] = 0; //positive votes for predicted char
        if (!totalNeg[r.pred]) totalNeg[r.pred] = 0; //negative votes
        if (!breakdown[r.pred]) breakdown[r.pred] = [];
        if (r.score>0)
        {
            totalPos[r.pred] += r.score;
        }
        else
        {
            totalNeg[r.pred]+=r.score;
        }
        console.log("char ",r.pred, " pos ",totalPos[r.pred]," neg ",totalNeg[r.pred]);
        breakdown[r.pred].push(r.type + "(" + r.score + ")");
    }

    // RS - Recency Suffix
    for (var len = input.length - 1; len >= 1; len--) {
        var S = input.slice(-len);
        var hist = input.slice(0, -S.length);
        var idx = hist.lastIndexOf(S);
        if (idx !== -1) {
            var p = input[idx + S.length];
            addRule({type: 'RS', pred: p, context: S + p, cond: S, score: 1});
            break;
        }
    }

    // AL - Alternates
    for (var i = 0; i < rels.al.length; i++) {
        var p = rels.al[i];
        var iA = getIdx(input, p[0]);
        var iB = getIdx(input, p[1]);
        var lA = iA[iA.length-1], lB = iB[iB.length-1];
        var pred = (lA > lB) ? p[0] : p[1];
        var cont = (lA < lB) ? p[0] : p[1];
        addRule({type: 'AL', pred: pred, context: cont, cond: "nil", score: -2});
    }

    // CF - Suffix with Partner Substitution
    for (var k = 0; k < rels.cf.length; k++) 
    {
        for (var len = input.length; len >= 0; len--) 
        {
            var S = input.slice(-len);
            var hist = input.slice(0, input.length - S.length); //material before suffix
            var idx = hist.lastIndexOf(S); //where S occurs
            if (idx !== -1 && idx + S.length < hist.length) //require hist longer than S
            {
                var histC = hist[idx + S.length]; //the char after S
                if (rels.cf[k][1] === histC) 
                {
                    partner = rels.cf[k][0];
                    addRule({type: 'CF', pred: partner, context: S + histC, cond: S || "(empty)", score:2});//1.1
                    break; //form only one
                }
            }
        }
    }

    // CP - Co-Predictors
    for (var i = 0; i < rels.cp.length; i++) {
        var p = rels.cp[i];
        var lastA = input.lastIndexOf(p[0]);
        var S = input.slice(lastA + 1);
        var mIdx = input.slice(0, -1).lastIndexOf(p[1] + S);
        if (mIdx !== -1) {
            var pred = input[mIdx + 1 + S.length];
            addRule({type: 'CP', pred: pred, context: p[1]+S+pred, cond: p[0]+S, score: 4});//3.1
        }
    }

    console.log("totalPos ", totalPos, " length ",Object.keys(totalPos).length);
    var candidates=findPosCandidates(totalPos);
    if (candidates.length==0) winner="?";
    else
    {
        var topScore=totalPos[candidates[0]]+totalNeg[candidates[0]];
        var winner=candidates[0];
        for(var i=0;i<candidates.length;i++)
        {
            if ((totalPos[candidates[i]]+totalNeg[candidates[i]])>topScore)
            {
                topScore=totalPos[candidates[i]]+totalNeg[candidates[i]];
                winner=candidates[i];
            }
        }
    }
    return {
        winner: winner,
        rules: rules,
        rels: rels,
        totalPos: totalPos,
        totalNeg: totalNeg,
        breakdown: breakdown
    };
}
function findPosCandidates(obj)
{
    var cands=[];
    var charKeys=Object.keys(obj);
    console.log("obj ",obj, "charkeys ",charKeys);
    for(var i=0;i<charKeys.length;i++)
    {
        console.log("obj[charKeys[i]] ",obj[charKeys[i]]);
        if (obj[charKeys[i]]>0)
            cands.push(charKeys[i]);
    }
    console.log("cands ",cands);
    return cands;
}
// ---------------------------------------------------------
// UI WRAPPER FOR MANUAL BUTTON
// ---------------------------------------------------------
function executeStepManual() {
    var input = document.getElementById('inputStr').value;
    var result = predictNext(input);

    // Update UI
    document.getElementById('cfDisp').innerText = result.rels.cf.map(function(x){return "CF("+x[0]+","+x[1]+")"}).join(" ") || "none";
    document.getElementById('cpDisp').innerText = result.rels.cp.map(function(x){return "CP("+x[0]+","+x[1]+")"}).join(" ") || "none";
    document.getElementById('alDisp').innerText = result.rels.al.map(function(x){return "AL("+x[0]+","+x[1]+")"}).join(" ") || "none";

    var rH = "";
    for (var i = 0; i < result.rules.length; i++) {
        var r = result.rules[i];
        rH += "<tr><td>"+r.type+"</td><td>"+r.context+"</td><td>"+r.cond+"</td><td>'"+r.pred+"'</td><td>"+r.score+"</td></tr>";
    }
    
    document.querySelector('#ruleTable tbody').innerHTML = rH;
    document.getElementById('inputStr').value = input + result.winner;
}

// ---------------------------------------------------------
// AUTOMATED TESTING SUITE (LETTERS)
// ---------------------------------------------------------

function generateRandomLetters(len) {
    var chars = "abcdefghijklmnopqrstuvwxyz";
    var s = "";
    for(var i=0; i<len; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return s;
}


function generateRandomPrompt() {
    const characters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    
    // Helper to generate a random string of length 1-8
    const getRandomSegment = () => {
        const length = Math.floor(Math.random() * 8) + 1;
        let result = '';
        for (let i = 0; i < length; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
    };

    let finalString = '';

    // Generate the 4 pairs of [string]{string}
    for (let i = 0; i < 4; i++) {
        const segment = getRandomSegment();
        finalString += `[${segment}]{${segment}}`;
    }

    return finalString;
}
function runTests() {
    var resultsDiv = document.getElementById('testResults');
    resultsDiv.innerHTML = "<h3>Running 100 Letter Tests...</h3>";
    
    setTimeout(function() {
        var failures = [];
        var successExamples=[];
        var totalTests = 100;
        var successes = 0;

        for (var t = 0; t < totalTests; t++) {
            // D is a sequence of 25 random letters
            var randomToBeCopied=generateRandomLetters(25);
            var currentInput=generateRandomPrompt()+'['+randomToBeCopied+']';
            
            
            var predictedSequence = "";
            var predictionTarget = "{" + randomToBeCopied + "}"; 

            for (var k = 0; k < 27; k++) {  //26
                var res = predictNext(currentInput);
                var char = res.winner;
                currentInput += char;
                predictedSequence += char;
            }

            if (predictedSequence === predictionTarget) {
                successes++;
                successExamples.push({ex:currentInput});
            } else {
                failures.push({
                    expected: currentInput,
                    actual: predictedSequence
                });
            }
        }

        // Render Results
        var html = "<div class='summary'>" + 
                    
                   "<span class='success'>Successes: " + successes + "</span> | " + 
                   "<span class='failure'>Failures: " + failures.length + "</span>" +
                   "</div>";
        if (successExamples.length > 5) {
            html += "<h3>Succss Examples:</h3>";
            for (var i = 0; i < 5; i++) {
                html += "<div class='fail-item'>";
                html += "<div><span class='fail-label'>Example:</span> " + successExamples[i].ex + "</div>";
                html += "</div>";
            }
}
        if (failures.length > 0) {
            html += "<h3>Failed Trials Details:</h3>";
            for (var i = 0; i < failures.length; i++) {
                html += "<div class='fail-item'>";
                html += "<div><span class='fail-label'>D (Sequence):</span> " + failures[i].expected + "</div>";
                html += "<div><span class='fail-label'>Predicted:</span> " + failures[i].actual + "</div>";
                html += "</div>";
            }
        } else {
            html += "<h3>All tests passed!</h3>";
        }

        resultsDiv.innerHTML = html;
    }, 10);
}
</script>
</body>
</html>
